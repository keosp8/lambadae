<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zenxy C2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{background:#09090b;font-family:Inter,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
</style>
</head>
<body class="min-h-screen flex items-center justify-center text-zinc-100">
<div class="w-full max-w-sm px-6">
  <div class="text-center mb-10">
    <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-white text-black flex items-center justify-center font-black text-lg">Z</div>
    <h1 class="text-xl font-bold tracking-tight">Zenxy <span class="text-zinc-500 font-normal">C2</span></h1>
    <p class="text-xs text-zinc-600 mono mt-1">CONTROL PANEL</p>
  </div>
  {% if error %}<p class="text-red-400 text-sm text-center mb-4 mono">{{ error }}</p>{% endif %}
  <form method="POST" class="space-y-3">
    <input type="password" name="password" placeholder="Password" autofocus required
      class="w-full px-4 py-3 rounded-lg bg-zinc-900 border border-zinc-800 text-sm focus:outline-none focus:border-zinc-500 mono">
    <button class="w-full py-3 rounded-lg bg-white text-black font-semibold text-sm hover:bg-zinc-200 transition">Enter</button>
  </form>
</div>
</body>
</html>
